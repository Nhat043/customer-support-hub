global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: workflow-platform-api
    metrics_path: /api/metrics
    static_configs:
      - targets: [api:4000]
        labels:
          service: api
          environment: local
  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: [qdrant:6333]
        labels:
          service: qdrant
          environment: local
