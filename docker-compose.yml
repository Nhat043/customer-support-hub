services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    # Keep the server within one minor version of @qdrant/js-client-rest (1.18).
    image: qdrant/qdrant:v1.18.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # This compose file is for local HTTP development, not a production deployment.
      NODE_ENV: development
      PORT: 4000
      RUN_MIGRATIONS: "true"
      WEB_BASE_URL: http://localhost:3000
      # Deliberately separate from DATABASE_URL in .env to prevent using a stale DB by accident.
      DATABASE_URL: ${LOCAL_DATABASE_URL:?Set LOCAL_DATABASE_URL to the local PostgreSQL database URL}
      REDIS_URL: redis://redis:6379
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-agent_memory_semantic_v1}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_MODEL: ${AI_MODEL:-mock-function-caller}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_USE_VERTEX_AI: ${GEMINI_USE_VERTEX_AI:-false}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_UPLOAD_DIR: /app/uploads
      GCS_PROJECT_ID: ${GCS_PROJECT_ID:-}
      GCS_ATTACHMENT_BUCKET: ${GCS_ATTACHMENT_BUCKET:-}
      # Local GCS tests use the developer's ADC file read-only. Deployed
      # workloads use their attached service account instead.
      GOOGLE_APPLICATION_CREDENTIALS: /var/run/secrets/google/application_default_credentials.json
      JWT_ACCESS_SECRET: replace-me-access-secret
      REFRESH_TOKEN_PEPPER: replace-me-refresh-token-pepper
      PASSWORD_RESET_TOKEN_PEPPER: ${PASSWORD_RESET_TOKEN_PEPPER:-}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 30d
      REFRESH_TOKEN_ABSOLUTE_TTL: 90d
      COOKIE_DOMAIN: localhost
      COOKIE_SECURE: "false"
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    extra_hosts:
      # Lets Docker Desktop containers reach PostgreSQL running on the host machine.
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"
    volumes:
      - attachment_data:/app/uploads
      - ${GCP_ADC_CREDENTIALS_FILE:-/dev/null}:/var/run/secrets/google/application_default_credentials.json:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
    depends_on:
      - api
    ports:
      - "3000:3000"

  prometheus:
    image: prom/prometheus:v3.4.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
      - alertmanager
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./infra/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/observability/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.3.2
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./infra/observability/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    ports:
      - "3001:3000"

volumes:
  qdrant_data:
  prometheus_data:
  loki_data:
  grafana_data:
  attachment_data:
